controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 50.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25 #放宽到25cm，高速omni机器人10cm太严导致绕圈
      yaw_goal_tolerance: 6.28
#    FollowPath:
#      plugin: "pb_omni_pid_pursuit_controller::OmniPidPursuitController"
#      translation_kp: 3.5
#      translation_ki: 0.45
#      translation_kd: 1.5
#      enable_rotation: false
#      rotation_kp: 3.0
#      rotation_ki: 0.5
#      rotation_kd: 0.3
#      transform_tolerance: 0.1
#      min_max_sum_error: 1.0
#      lookahead_dist: 0.5
#      use_velocity_scaled_lookahead_dist: true
#      lookahead_time: 1.0
#      min_lookahead_dist: 0.5
#      max_lookahead_dist: 1.0
#      use_interpolation: true
#      use_rotate_to_heading: false
#      use_rotate_to_heading_treshold: 0.1
#      min_approach_linear_velocity: 0.5
#      approach_velocity_scaling_dist: 1.0
#      v_linear_min: -2.0
#      v_linear_max: 2.0
#      v_angular_min: -3.0
#      v_angular_max: 3.0
#      curvature_min: 0.4                                # 低曲率阈值，低于此值不减速。
#      curvature_max: 0.5                                # 高曲率阈值，高于此值大幅减速。
#      reduction_ratio_at_high_curvature: 0.5            # 高曲率时的速度降低比例。 0.5 (即减速 50%)
#      curvature_forward_dist: 0.7                       # 前向距离，用于曲率计算
#      curvature_backward_dist: 0.3                      # 后向距离，用于曲率计算
#      max_velocity_scaling_factor_rate: 0.9             # 速度缩放因子的最大变化率
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 60  #是指在每个控制周期内，控制器将生成的轨迹点数。
      model_dt: 0.05  #是指控制器的时间步长，值越小，控制器越精确，但计算量也越大。
      batch_size: 2000 #控制器的采样数。

      vx_std: 0.3 #线速度噪声标准差，配合高速需要更聚焦的采样
      vy_std: 0.3
      wz_std: 0.4

      vx_max: 7.5
      vy_max: 7.5
      wz_max: 2.5

      vx_min: -7.5
      vy_min: -7.5
      wz_min: -2.5

      ax_max: 3.5 #加速度提高，高速时能快速响应
      ay_max: 3.5
      az_max: 3.0

      ax_min: -3.5 #关键：制动力必须对称，高速下刹得住
      ay_min: -3.5
      az_min: -3.0

      iteration_count: 1
      prune_distance: 1.7 #高速下提前剪枝已通过的路径点
      transform_tolerance: 0.1
      temperature: 0.25 #大幅降低：让 MPPI 更果断选最优轨迹，不在次优之间摇摆
      gamma: 0.015 #稍微提高正则化，减少激进抖动
      motion_model: "Omni" #控制器的运动模型。
      visualize: true #是否可视化。
      reset_period: 0.08 # (only in Humble)
      retry_attempt_limit: 2 #软重置的尝试次数
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5 #是指在可视化轨迹时，每隔多少个轨迹点绘制一个点。
        time_step: 3 #是指在可视化轨迹时，每隔多少个时间步长绘制一个点。
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "PathFollowCritic", "PathAlignCritic", "ObstaclesCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      GoalCritic: #必须开启，否则机器人没有到达目标的动力
        enabled: true
        cost_power: 1
        cost_weight: 15.0 #大幅提高，近目标时必须压过其他critic成为主导力
        threshold_to_consider: 2.5 #提前激活，给高速机器人足够减速距离

      ObstaclesCritic: #开启提供额外的障碍物排斥力
        enabled: true
        cost_power: 1
        repulsion_weight: 1.5 #排斥权重
        critical_weight: 20.0 #近距离障碍物惩罚
        consider_footprint: false #用圆形近似，omni机器人更高效
        collision_cost: 10000.0
        collision_margin_distance: 0.1 #碰撞边界余量
        near_goal_distance: 0.5

      CostCritic: #通过 costmap 梯度引导避障
        enabled: true
        cost_power: 1
        cost_weight: 3.8 #适当降低，配合修正后的 inflation 梯度
        critical_cost: 253.0 #关键修正！只有 inscribed/lethal 才触发碰撞惩罚，不再把整个膨胀区都当碰撞
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      PathFollowCritic: #必须开启，这是防止乱跑的核心
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5 #关注路径前方更远的点
        threshold_to_consider: 1.5 #距目标1.5m内关闭（交给GoalCritic）

      PathAlignCritic: #让轨迹方向与路径对齐，高速下更平滑
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 1.5 #关键修正！与PathFollowCritic同步关闭，消除近目标区的切线力
        offset_from_furthest: 20
        use_path_orientations: false #omni机器人用运动方向而非朝向

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link_fake
      use_sim_time: False
      rolling_window: true
      width: 14 #高速需要更大感知范围，7.5m/s × 2s ≈ 15m
      height: 14
      resolution: 0.05
      robot_radius: 0.2
      footprint: "[ [0.15, 0.15], [0.15, -0.15], [-0.15, -0.15], [-0.15, 0.15] ]"
      plugins: ["static_layer","stvl_voxel_layer","inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0 #关键修正！原0.3衰减太慢，整个膨胀区代价都极高，MPPI没有梯度可用。5.0让代价快速衰减，形成清晰的"远离障碍物"梯度
        inflation_radius: 0.75 #加大膨胀半径，高速下需要更早看到障碍物
      stvl_voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 0.5     #seconds if linear, e^n if exponential
        decay_model: 0      #0=linear, 1=exponential, 2=persistent
        voxel_size: 0.05   #meters
        track_unknown_space: true   #default space is unknown
        observation_persistence: 0.0  #seconds
        max_obstacle_height: 2.0    #meters
        mark_threshold: 0      #voxel height
        update_footprint_enabled: true
        combination_method: 1      #1=max, 0=override
        obstacle_range: 3.0    #meters
        origin_z: 0.0    #meters
        publish_voxel_map: true   # default off
        transform_tolerance: 0.2    # seconds
        mapping_mode: false  # default off, saves map not for navigation
        map_save_duration: 60.0     #default 60s, how often to autosave
        observation_sources: livox_source #realsense_source
        livox_source:
          data_type: PointCloud2
          topic:  /livox/lidar_filtered
          transport_type: "raw"        #default raw -No compression-, Options: zlib, draco, zstd
          marking: true
          clearing: true

          obstacle_range: 8.0
          raytrace_range: 9.0

          min_obstacle_height: 0.1     #default 0, meters
          max_obstacle_height: 1.0     #defaule 3, meters
          expected_update_rate: 0.0    #default 0, if not updating at this rate at least, remove from buffer
          observation_persistence: 0.0 #default 0, use all measurements taken during now-value, 0=latest
          inf_is_valid: false          #default false, for laser scans
          clear_after_reading: true    #default false, clear the buffer after the layer gets readings from it
          filter: "voxel"              #default passthrough, apply "voxel", "passthrough", or no filter to sensor data, recommended to have at one filter on
          voxel_min_points: 0          #default 0, minimum points per voxel for voxel filter
          model_type: 1
          vertical_fov_angle: 2.00      #default 0.7, radians
          vertical_fov_offset: 0.0
          horizontal_fov_angle: 6.28
        realsense_source:
          enabled: true                #default true, can be toggled on/off with associated service call
          data_type: PointCloud2
          topic: /camera/camera/depth/color/points
          transport_type: "raw"        #default raw -No compression-, Options: zlib, draco, zstd
          marking: true
          clearing: true
          min_z: 0.2                   #default 0, meters
          max_z: 7.0                   #default 10, meters
          min_obstacle_height: 0.2     #default 0, meters
          vertical_fov_angle: 0.7      #default 0.7, radians
          vertical_fov_offset: 0.0     # default 0, radians. 3D Lidar only. Offset from planar axis. f.e. MID360 has a vFOV of -7deg to 52deg => offset +22.5deg (0.3927 rad)
          horizontal_fov_angle: 1.04   #default 1.04, radians
          decay_acceleration: 1.       #default 0, 1/s^2. If laser scanner MUST be 0
          model_type: 0                #default 0 (depth camera). Use 1 for 3D Lidar
      always_send_full_costmap: True


