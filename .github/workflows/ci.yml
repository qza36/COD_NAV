name: Build
on:
  push:
    branches: [ rmul2026 ]
  pull_request:
    branches: [ master ]

jobs:
  Build:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-desktop-latest
    steps:
      - name: Install Livox SDK
        run: |
          git clone https://github.com/Livox-SDK/Livox-SDK2.git
          cd Livox-SDK2/
          mkdir build
          cd build
          cmake .. && make -j
          sudo make install
      - name: Install small_gicp
        run: |
          git clone https://github.com/koide3/small_gicp.git
          sudo apt install -y libeigen3-dev libomp-dev
          cd small_gicp
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release && make -j
          sudo make install
      - name: Install Livox Driver
        run: |
          git clone https://github.com/qza36/livox_driver2_ros2.git
          mkdir -p ws_livox/src
          mv livox_driver2_ros2 ws_livox/src
          cd ws_liovx/src/livox_driver2_ros2 && ./build.sh humble
          source install/setup.sh

      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: ROS 2 CI Action
        uses: ros-tooling/action-ros-ci@0.4.1
        with:
          target-ros2-distro: humble
          skip-tests: true
